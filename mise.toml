# Local toolchain pins. CI does not read this file -- it installs pnpm via
# pnpm/action-setup and node via .nvmrc (see .github/workflows/ci.yml).
#
# Node is deliberately absent here: .nvmrc owns the node version and mise reads
# it directly, so duplicating it would create a second place to change.
#
# pnpm is pinned here so the version in `packageManager` is already on PATH and
# no switch is attempted. That used to be a hard requirement rather than a
# convenience: pnpm refused to switch to a version it could not verify, and the
# 1ES proxy in .npmrc publishes no npm registry signatures (no dist.signatures,
# no /-/npm/v1/keys, no attestations -- only a SHA-1 shasum), so the
# `packageManager` field alone could not be satisfied on this workspace.
#
# pnpm 11.21.0 lifted that. pnpm/pnpm#13728 fixed both halves of it, against
# this exact proxy: package-manager entries are now recorded integrity-only
# (the advertised tarball host is dropped, since the bootstrap always derives
# the URL from the trusted registries), and the engine signature falls back to
# registry.npmjs.org when the configured registry cannot provide one. Keep the
# two versions equal anyway -- a switch that works is still a download nobody
# asked for -- but this is now determinism, not a workaround.
#
# The aqua backend fetches from GitHub releases and verifies a checksum, and
# mise.lock records the resolved version and hash per platform -- that is the
# content pin, so a re-published or swapped artifact at the same version fails
# rather than silently installing.
[tools]
pnpm = "11.25.0"
ripgrep = "15.2.0"

[settings]
lockfile = true
# Read .nvmrc and .bun-version instead of restating their versions here. mise
# ignores idiomatic version files unless each tool opts in, while CI reads both
# files directly via setup-node and setup-bun -- so without this, local tools
# can be missing or silently run a different version. verify-workspace.mjs also
# asserts the running Node major against .nvmrc.
idiomatic_version_file_enable_tools = ["node", "bun"]
