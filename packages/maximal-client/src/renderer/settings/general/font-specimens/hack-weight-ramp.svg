<svg xmlns="http://www.w3.org/2000/svg" width="720" height="150" viewBox="0 0 720 150" role="img" aria-label="Hack weight ramp">
  <style>
    text { fill: #f4f5f7; }
    .meta { fill: #9da5b4; font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: light) {
      text { fill: #17191d; }
      .meta { fill: #606775; }
    }
  </style>
  <text class="meta" x="0" y="14" font-size="11">WEIGHT RAMP</text>
  <text class="meta" x="0" y="39" font-size="11">300</text>
  <text x="54" y="39" font-family="Hack Nerd Font Mono" font-size="17" font-weight="300">Light — Hamburgefontsiv 0123456789</text>
  <text class="meta" x="0" y="66" font-size="11">400</text>
  <text x="54" y="66" font-family="Hack Nerd Font Mono" font-size="17" font-weight="400">Regular — Hamburgefontsiv 0123456789</text>
  <text class="meta" x="0" y="93" font-size="11">500</text>
  <text x="54" y="93" font-family="Hack Nerd Font Mono" font-size="17" font-weight="500">Medium — Hamburgefontsiv 0123456789</text>
  <text class="meta" x="0" y="120" font-size="11">600</text>
  <text x="54" y="120" font-family="Hack Nerd Font Mono" font-size="17" font-weight="600">Semibold — Hamburgefontsiv 0123456789</text>
  <text class="meta" x="0" y="147" font-size="11">700</text>
  <text x="54" y="147" font-family="Hack Nerd Font Mono" font-size="17" font-weight="700">Bold — Hamburgefontsiv 0123456789</text>
</svg>
