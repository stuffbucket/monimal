<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The same policy as src/renderer/index.html, verbatim, and it has to be.

      This fixture renders the real TerminalView. Keep its policy in step with
      the shell so the recording exercises the packaged security constraints.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stuffbucket</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
