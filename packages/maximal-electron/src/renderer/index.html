<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The renderer is sandboxed and context-isolated, so this policy is the
      second layer, not the only one.

      'unsafe-inline' for styles is required by Radix, which sets inline styles
      for positioning. 'wasm-unsafe-eval' is required by ghostty-web, which
      compiles Ghostty's VT parser from WebAssembly. That directive permits
      WebAssembly only; it does not re-enable eval for JavaScript.

      ghostty-web ships the WebAssembly module inlined as a data URL and
      fetches it at startup, so connect-src has to allow data:. There is no
      separate .wasm asset to serve.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stuffbucket</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
