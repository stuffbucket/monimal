<!doctype html>
<!--
  Pre-boot splash, modeled on stuffbucket/maximal's shell/splash.html.

  SELF-CONTAINED on purpose: all CSS is inline and there is no script. At first
  paint there is no guarantee that a stylesheet, a font, or the bridge has
  loaded, so this file depends on none of them.

  The colour values mirror src/renderer/styles/tokens.css. Keep them in sync.

  Lifecycle: src/main/windows/splash.ts creates this window at launch. The main
  window's `ready-to-show` closes it, and a 10 second timer closes it anyway, so
  a missed signal never strands it on screen.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Stuffbucket</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        cursor: default;
      }

      .splash {
        box-sizing: border-box;
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 32px;
        border-radius: 14px;
        background: #1b1e24;
        border: 1px solid #2b313a;
        box-shadow: 0 12px 40px rgb(0 0 0 / 0.45);
        font:
          400 13px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          system-ui,
          sans-serif;
        color: #e6e8ec;
        text-align: center;
      }

      .mark {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        background: #6ea8fe;
        display: grid;
        place-items: center;
      }

      .mark span {
        display: block;
        width: 26px;
        height: 8px;
        border-radius: 4px;
        background: #16181d;
      }

      .name {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .status {
        font-size: 12px;
        color: #8b93a1;
      }

      /* A determinate-looking sweep. It reports "working", not progress. */
      .bar {
        width: 168px;
        height: 3px;
        border-radius: 999px;
        background: #262b33;
        overflow: hidden;
      }

      .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #6ea8fe;
        animation: sweep 1.1s ease-in-out infinite;
      }

      @keyframes sweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="mark"><span></span></div>
      <div class="name">Stuffbucket</div>
      <div class="bar"></div>
      <div class="status">Starting…</div>
    </div>
  </body>
</html>
