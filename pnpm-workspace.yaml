packages:
  - "packages/*"
  # Link the Electron app's local workspace dependencies.
  - "packages/maximal/client"
  # Include the nested Astro site in this lockfile.
  - "packages/maximal/site"

# Warn about dependency drift before scripts without performing an implicit install.
verifyDepsBeforeRun: warn

# pnpm 11 reads workspace settings from this file.
overrides:
  prettier: 3.8.3
  # Security fix for transitive build tooling.
  tar: 7.5.22
  # Electron-maintained replacement for vulnerable extract-zip.
  extract-zip: npm:@electron-internal/extract-zip@1.0.5
  # Security fix for the transitive tmp dependency.
  tmp: 0.2.7
  # Security fix for the transitive qs dependency.
  qs: 6.15.3
  # Keep a patched esbuild version across the dependency graph.
  esbuild: 0.28.2
  # Use the registry release instead of Electron rebuild's git dependency.
  "@electron/node-gyp": 10.2.0-electron.1

# Allow required native and postinstall builds.
allowBuilds:
  "@google/genai": true
  "electron": true
  "esbuild": true
  "node-llama-cpp": true
  "node-pty": true
  "protobufjs": true

# Required by Electron Forge and Rolldown.
publicHoistPattern:
  - "*"
