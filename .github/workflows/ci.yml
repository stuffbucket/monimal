name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      test_trace:
        description: >-
          Module-evaluation tracing for the bun suites. Use when a test fails
          only in CI, or only in a particular order. See
          packages/maximal-core/docs/dev/testing-strategy.md 5.7.
        type: choice
        options: ["off", "tests", "all"]
        default: "off"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

# GitHub's default is `bash -e {0}`: -e without -o pipefail. A pipeline reports
# the exit status of its LAST command, so `run-something | tee log` reports
# tee's success and a failing step passes. Every pipeline in this file today is
# either a deliberate predicate (`| grep -q`) or has its output asserted on the
# next line, so nothing is currently masked -- this keeps it that way without
# anyone having to notice.
defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  check:
    name: build / typecheck / lint / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm before setup-node, so setup-node's cache can find it. The version
      # comes from packageManager in package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # maximal and maximal-core genuinely build and test with Bun. The root
      # version file is also a Turbo global input, so runtime bumps invalidate
      # results produced under the previous version.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Restore turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      # Checks this file itself: workflow schema, plus shellcheck over every
      # `run:` block. That shell is not covered by any other lint here.
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - run: pnpm install --frozen-lockfile

      # Reads the installed tree rather than trusting accepted configuration.
      - name: Verify workspace installation
        run: pnpm run verify:workspace

      # Build/typecheck/lint use normal graph parallelism. Tests alone are
      # serialized because Bun suites bind ports and install signal handlers.
      # The sidecar build is intentionally uncached and executes on every run;
      # the Astro site is a normal workspace build covered here too.
      - name: Check workspace
        run: pnpm run check
        env:
          # Inverted deliberately: the string "off" is truthy and would enable
          # tracing if forwarded directly.
          MAXIMAL_TEST_TRACE: ${{ inputs.test_trace != 'off' && inputs.test_trace || '' }}

      # Build/install mechanics outside the normal package scripts. Release-time
      # checks that require a tag or packaged app remain out of the PR gate.
      - name: Verify package mechanics
        run: |
          pnpm --filter @stuffbucket/maximal-electron run verify:fixture-imports
          pnpm --filter @stuffbucket/maximal-electron run verify:neutral
          pnpm --filter @stuffbucket/maximal-electron run verify:docs
          pnpm --filter @stuffbucket/maximal-electron exec node scripts/verify-exports.mjs
          pnpm --filter @stuffbucket/maximal-electron run check:contrast

      # Prove that the client compiled this checkout's workspace core rather
      # than the stale git dependency from the copied upstream manifest.
      - name: Verify sidecar provenance
        run: |
          set -euo pipefail
          LINK=packages/maximal/client/node_modules/@stuffbucket/maximal-core
          test -L "$LINK" || { echo "::error::$LINK is not a workspace symlink"; exit 1; }
          TARGET="$(cd "$(dirname "$LINK")" && cd "$(readlink "$(basename "$LINK")")" && pwd)"
          EXPECTED="$PWD/packages/maximal-core"
          echo "resolves to: $TARGET"
          test "$TARGET" = "$EXPECTED" || { echo "::error::expected $EXPECTED"; exit 1; }
          BIN=packages/maximal/client/resources/bin/maximal-core
          test -s "$BIN" || { echo "::error::no sidecar at $BIN"; exit 1; }
          SHA="$(git rev-parse HEAD)"
          # Process substitution, not a pipe: `grep -q` exits at the first
          # match, which SIGPIPEs `strings` part-way through a 74MB binary.
          # Under pipefail that 141 becomes the pipeline's status and this
          # check fails on a sidecar that is correct.
          grep -qF "$SHA" < <(strings "$BIN") || {
            echo "::error::sidecar does not embed HEAD ($SHA) — built from something else"
            exit 1
          }
          echo "sidecar embeds $SHA, core $(node -p "require('./packages/maximal-core/package.json').version")"

  # Exercises Forge packaging and the public-hoist behavior that ordinary
  # build/typecheck/lint/test do not prove.
  package:
    name: electron package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Dependency builds can replay from a previous run. The Git-dependent
      # maximal-client sidecar build is uncached and therefore recompiles.
      - name: Restore turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      # Electron's binary is fetched by a postinstall. The exact manifest pin
      # avoids writing another ~100MB cache entry after unrelated lock changes.
      - name: Cache the Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('packages/maximal/client/package.json') }}
          restore-keys: electron-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Verify workspace installation
        run: pnpm run verify:workspace

      - run: pnpm run package

      - name: Verify packaged app contents
        run: |
          set -euo pipefail
          OUT=packages/maximal/client/out
          APP="$(find "$OUT" -maxdepth 1 -type d -name 'Maximal-*' | head -1)"
          test -n "$APP" || { echo "::error::no packaged app under $OUT"; exit 1; }
          echo "packaged: $APP"
          ASAR="$(find "$APP" -name app.asar | head -1)"
          test -s "$ASAR" || { echo "::error::no app.asar in $APP"; exit 1; }
          SIDECAR="$(find "$APP" -name 'maximal-core*' | head -1)"
          test -s "$SIDECAR" || { echo "::error::no sidecar in $APP"; exit 1; }
          echo "asar $(stat -c%s "$ASAR") bytes, sidecar $(stat -c%s "$SIDECAR") bytes"
