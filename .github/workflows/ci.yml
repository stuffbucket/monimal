name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turborepo's own telemetry prompt, off in CI.
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: build / typecheck / lint / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # pnpm before setup-node, so setup-node's cache: pnpm can find it.
      - uses: pnpm/action-setup@v4
        with:
          # No version here: it comes from packageManager in package.json,
          # so there is one place to change it.
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # maximal and maximal-core build and test with bun, not node. Both pin a
      # .bun-version, and they disagree (1.3.11 vs 1.3.14) because they are
      # separate repos upstream; take the newer.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Turborepo's local cache. Keyed on the lockfile plus the commit, falling
      # back to any cache for the same lockfile, so an unchanged dependency set
      # still gets warm task results.
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Fails if any dependency resolves differently than the source repos.
      # Advisory: this workspace has one lockfile, so some float is expected.
      - name: Report dependency float
        run: pnpm run check:float
        continue-on-error: true

      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build

      # Serialized on purpose: maximal and maximal-core both bind ports and
      # install signal handlers, and interfere when run concurrently.
      - run: pnpm run test

  # There is deliberately no macOS job here. Per AGENTS.md this repo never uses
  # a GitHub-hosted macOS runner; macOS work is dispatched to the private
  # stuffbucket/macos-builder, which owns the only self-hosted Mac and the only
  # copy of the Apple signing material.
  #
  # What the removed job did, so it is not lost by accident: it packaged
  # Maximal.app on every push and asserted the bundled sidecar's version matched
  # the workspace copy of maximal-core, which is what catches a silent fall-back
  # to the stale git pin. The builder cannot take that over as-is — it is
  # tag-driven (its `ref` input is validated against
  # ^v?[0-9][0-9A-Za-z.+~_-]{0,99}$, and it uploads onto an existing release),
  # so it packages releases, not pushes. Re-establishing the version-binding
  # half on Linux, where it never needed a Mac, is still open.

