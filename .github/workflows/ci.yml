name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      test_trace:
        description: >-
          Module-evaluation tracing for the bun suites. Use when a test fails
          only in CI, or only in a particular order. See
          packages/maximal-core/docs/dev/testing-strategy.md 5.7.
        type: choice
        options: ["off", "tests", "all"]
        default: "off"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turborepo's own telemetry prompt, off in CI.
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: build / typecheck / lint / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm before setup-node, so setup-node's cache: pnpm can find it.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # No version here: it comes from packageManager in package.json,
          # so there is one place to change it.
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # maximal and maximal-core build and test with bun, not node. Both pin a
      # .bun-version, and they disagree (1.3.11 vs 1.3.14) because they are
      # separate repos upstream; the root .bun-version takes the newer. It lives
      # in a file rather than inline so turbo can hash it: a runtime bump has to
      # invalidate every task, or CI replays results produced under the old one.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Turborepo's local cache. Keyed on the lockfile plus the commit, falling
      # back to any cache for the same lockfile, so an unchanged dependency set
      # still gets warm task results.
      - name: Restore turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build

      # Restores what the deleted macOS packaging job used to prove: that the
      # client bundles THIS workspace's maximal-core rather than falling back to
      # the stale git pin it ships with upstream.
      #
      # The old check ran `maximal-core --version` inside the packaged .app,
      # which needs a Mac. These two assertions need neither a Mac nor an
      # executable: the sidecar is compiled --target=bun-darwin-arm64 and cannot
      # run on the runner, but it can be read.
      - name: Verify the sidecar came from this workspace
        run: |
          set -euo pipefail
          LINK=packages/maximal/client/node_modules/@stuffbucket/maximal-core
          # 1. The dependency resolves to the workspace copy, not a git tarball.
          test -L "$LINK" || { echo "::error::$LINK is not a workspace symlink"; exit 1; }
          TARGET="$(cd "$(dirname "$LINK")" && cd "$(readlink "$(basename "$LINK")")" && pwd)"
          EXPECTED="$PWD/packages/maximal-core"
          echo "resolves to: $TARGET"
          test "$TARGET" = "$EXPECTED" || { echo "::error::expected $EXPECTED"; exit 1; }
          # 2. The compiled sidecar carries this commit, so it was built from
          #    that copy in this run and is not a stale or cached artifact.
          BIN=packages/maximal/client/resources/bin/maximal-core
          test -s "$BIN" || { echo "::error::no sidecar at $BIN"; exit 1; }
          SHA="$(git rev-parse HEAD)"
          strings "$BIN" | grep -qF "$SHA" || {
            echo "::error::sidecar does not embed HEAD ($SHA) — built from something else"
            exit 1
          }
          echo "sidecar embeds $SHA, core $(node -p "require('./packages/maximal-core/package.json').version")"

      # Serialized on purpose: maximal and maximal-core both bind ports and
      # install signal handlers, and interfere when run concurrently.
      #
      # Split by runner, not by preference: the two bun suites and the two
      # vitest ones take different reporter flags. Both write a JUnit file,
      # uploaded below, which is the only durable per-test record a failed run
      # leaves -- name, file, line and duration per test, comparable against a
      # green run. Bun's <failure> element carries no message, so the console
      # output is still where the diff and stack live.
      #
      # Console output is unaffected. Invoked directly, `bun test
      # --reporter=junit` replaces the per-test lines; run through turbo it does
      # not, so the log keeps every (pass)/(fail) line AND we get the file.
      - name: test (bun suites)
        run: |
          mkdir -p packages/maximal/reports packages/maximal-core/reports
          pnpm exec turbo run test --concurrency=1 \
            --filter=@stuffbucket/maximal --filter=@stuffbucket/maximal-core \
            -- --reporter=junit --reporter-outfile=reports/junit.xml
        env:
          # Inverted on purpose. `a && b || c` falls through to c when b is
          # falsy, so `== 'off' && '' || inputs.test_trace` yields the string
          # "off" — which is truthy, and would switch the tracer ON.
          MAXIMAL_TEST_TRACE: ${{ inputs.test_trace != 'off' && inputs.test_trace || '' }}

      - name: test (vitest suites)
        run: |
          mkdir -p packages/maximal-electron/reports packages/maximal/client/reports
          pnpm exec turbo run test --concurrency=1 \
            --filter=@stuffbucket/maximal-electron --filter=maximal-client \
            -- --reporter=default --reporter=junit --outputFile=reports/junit.xml

      # `always()`: the report is worth most when the run is red.
      #
      # `reports/**` is declared as a turbo output on the test task, so a
      # replayed cache hit restores the file and every run carries an artifact,
      # not just the ones that execute tests.
      #
      # READ A RESTORED REPORT WITH CARE. It holds the timings of whichever run
      # last produced that hash, which is NOT necessarily this commit: turbo's
      # inputs exclude .github/**, reports/**, research_log/** and .claude/**,
      # and cover only the four package directories. Two commits with different
      # content can share a hash and therefore an artifact. Check whether the
      # run's test tasks say "cache miss, executing" before treating the numbers
      # as this commit's.
      #
      # Paths are one directory deep on purpose. `packages/**/reports` follows
      # pnpm's workspace symlinks into node_modules and uploads every report a
      # second time under the package that links it.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            packages/*/reports/junit.xml
            packages/maximal/client/reports/junit.xml
          if-no-files-found: ignore
          retention-days: 30

  # No macOS job here; see AGENTS.md. The job that was removed also asserted the
  # packaged sidecar's version matched the workspace maximal-core, catching a
  # fall-back to the stale git pin. That check has no replacement yet.

