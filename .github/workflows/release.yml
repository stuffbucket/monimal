# Signed + notarized macOS release.
#
# This repository never sees an Apple credential. It creates a DRAFT release at
# a tag, asks the private stuffbucket/macos-builder to build that tag, and waits
# for the signed, notarized, stapled .dmg to be attached. The builder owns the
# self-hosted Mac and every Apple secret. RELEASING.md owns the process.
#
# Triggers:
#   push tags   the tag IS the version. packages/maximal/client/package.json
#               stays 0.0.0 and is stamped from the tag at build time, so there
#               is no second place to bump.
#   dispatch    recovery. Every job below is idempotent: a re-run reuses the
#               existing draft, re-dispatches, and re-waits.
#
# `release: published` is deliberately NOT a trigger. The builder's upload is
# asynchronous, and attaching an asset after publish is HTTP 422 once immutable
# releases are on. Draft-first works either way.
#
# Neither trigger fires on pull_request, which is what keeps MACOS_BUILDER_PAT
# out of reach of a fork PR in this public repo.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach artifacts to, e.g. v0.5.0-rc.1
        required: true
        type: string
      allow_identity_change:
        description: >-
          Release even though the bundle id changed since the previous tag. This
          makes every existing install a different app to macOS. Deliberate
          migrations only.
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  # Never cancel a run that is mid-notarization; Apple's queue is not resumable.
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    # GitHub's default is `bash -e {0}`: -e without -o pipefail. A pipeline
    # reports the exit status of its LAST command, so a failing step passes.
    shell: bash -eo pipefail {0}

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      dmg: ${{ steps.config.outputs.dmg }}
      zip: ${{ steps.config.outputs.zip }}
      app_name: ${{ steps.config.outputs.app_name }}
      bundle_id: ${{ steps.config.outputs.bundle_id }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `git branch --contains` needs the branches, not just the tag.
          fetch-depth: 0

      - name: Resolve and validate the tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          [ -n "$TAG" ] || { echo "::error::No tag to release."; exit 1; }

          # Our shape.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Tag '${TAG}' is not vMAJOR.MINOR.PATCH[-prerelease]."
            exit 1
          fi
          # The builder's shape, asserted HERE so a bad ref fails in seconds
          # rather than minutes after dispatch with no artifact and no cause.
          # It rejects anything containing a slash or a non-numeric prefix, so
          # `release/0.5` and `client-v1.0.0` are unbuildable by construction.
          if ! printf '%s' "$TAG" | grep -Eq '^v?[0-9][0-9A-Za-z.+~_-]{0,99}$'; then
            echo "::error::Tag '${TAG}' is rejected by the builder's ref pattern."
            exit 1
          fi

          git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null \
            || { echo "::error::Tag '${TAG}' does not exist in this repository."; exit 1; }
          SHA="$(git rev-list -n1 "$TAG")"

          # A prerelease is any tag carrying a hyphenated suffix.
          PRE=false
          case "$TAG" in *-*) PRE=true ;; esac

          {
            echo "tag=${TAG}"
            echo "sha=${SHA}"
            echo "prerelease=${PRE}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG} at ${SHA} (prerelease=${PRE})"

      - name: Assert the tag is on a released line
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          # What breaks otherwise is not tidiness. The producer runs arbitrary
          # repository code on the self-hosted Mac that holds the Developer ID
          # in its keychain. This check, plus the tag ruleset, IS the access
          # control on that machine.
          # checkout@v7 with fetch-depth 0 normally leaves origin/* in place, but
          # a tag push fetches the tag first; make the branch refs explicit so
          # this check can never pass or fail for want of a remote ref.
          git fetch --quiet --prune origin '+refs/heads/*:refs/remotes/origin/*'
          LINES="$(git branch -r --contains "$SHA" --list 'origin/main' 'origin/release/*')"
          if [ -z "$LINES" ]; then
            echo "::error::${TAG} (${SHA}) is not contained in origin/main or any origin/release/* branch."
            exit 1
          fi
          echo "Contained in:"
          echo "$LINES"

      - name: Assert CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          # Deliberately does not name individual job names. ci.yml owns those;
          # restating them here creates a second owner that drifts silently.
          RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100" \
                    --jq '.check_runs[] | "\(.name)|\(.conclusion)|\(.details_url)"')"

          # Drop every check run belonging to THIS workflow — the current attempt
          # AND any earlier one on the same commit.
          #
          # The current run's jobs are still in progress and would read as
          # conclusion=null. An EARLIER attempt is worse: a release run that was
          # cancelled or timed out leaves its jobs behind as check runs with
          # conclusion=cancelled/failure, and this step would then read the
          # previous attempt as failed CI and refuse the retry. That is precisely
          # the situation RELEASING.md tells you to recover from by re-running
          # with the same tag, so filtering on GITHUB_RUN_ID alone made the
          # documented recovery path unusable exactly when it was needed.
          #
          # Resolved by workflow id rather than by filename or job names: this
          # file is not a second owner of either.
          WF_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .workflow_id)"
          SELF_IDS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WF_ID}/runs?per_page=100" \
                        --jq '.workflow_runs[].id')"
          OTHERS="$RUNS"
          for rid in $SELF_IDS; do
            OTHERS="$(printf '%s\n' "$OTHERS" | grep -vF "/actions/runs/${rid}/" || true)"
          done

          if [ -z "$OTHERS" ]; then
            echo "::error::No check runs on ${SHA} apart from this release run. Was CI ever run on this commit?"
            exit 1
          fi
          printf '%s\n' "$OTHERS" | awk -F'|' '{printf "  %s = %s\n", $1, $2}'

          # An unfinished check reports conclusion=null, which is a different
          # problem from a failed one: the tag was pushed before CI settled.
          PENDING="$(printf '%s\n' "$OTHERS" | awk -F'|' '$2 == "null" || $2 == "" { print $1 }')"
          if [ -n "$PENDING" ]; then
            echo "::error::CI has not finished on ${SHA}; still running: $(printf '%s' "$PENDING" | tr '\n' ' ')"
            exit 1
          fi

          BAD="$(printf '%s\n' "$OTHERS" | awk -F'|' '$2 != "success" && $2 != "skipped" && $2 != "neutral" { print $1 "=" $2 }')"
          if [ -n "$BAD" ]; then
            echo "::error::Non-success checks on ${SHA}: $(printf '%s' "$BAD" | tr '\n' ' ')"
            exit 1
          fi

      - name: Read the builder contract
        id: config
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          # The CONTRACT comes from the tag. The SCRIPTS come from the checkout.
          #
          # On a tag push those are the same commit and this reads as a no-op.
          # On workflow_dispatch — the recovery path — the checkout is a branch,
          # so a fix to this workflow or to scripts/release/ reaches an
          # already-cut tag, while the contract being released stays the tag's
          # own. Reading .macos-builder/config from the working tree would
          # silently release main's contract at the tag's commit.
          #
          # forge.config.ts is pulled from the tag for the same reason: the
          # bundle-id cross-check has to compare the tag against itself.
          D="$RUNNER_TEMP/contract"
          mkdir -p "$D"
          git show "${TAG}:.macos-builder/config" > "$D/config" \
            || { echo "::error::${TAG} has no .macos-builder/config."; exit 1; }
          git show "${TAG}:packages/maximal/client/forge.config.ts" > "$D/forge.config.ts" \
            || { echo "::error::${TAG} has no client forge.config.ts."; exit 1; }

          # tee, not a redirect, so the resolved names appear in the log too.
          # `tee` consumes all of its input, so there is no early-exit reader
          # here for pipefail to trip over.
          scripts/release/contract.sh \
            --config "$D/config" \
            --forge "$D/forge.config.ts" \
            --tag "$TAG" | tee -a "$GITHUB_OUTPUT"

      - name: Assert the app identity has not changed since the previous tag
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          BUNDLE_ID: ${{ steps.config.outputs.bundle_id }}
          ALLOW: ${{ inputs.allow_identity_change }}
        run: |
          # macOS decides whether a new build is an UPGRADE of an installed one,
          # or an unrelated app, from the bundle identifier and the code
          # signature's designated requirement. Change either and every existing
          # install loses its TCC grants and orphans its keychain items — and
          # nothing else in this pipeline notices, because both halves of the
          # comparison are internally consistent within a single release.
          #
          # Checked here: the bundle id, against the previous tag's contract.
          # NOT checked here: the designated requirement, which needs the signed
          # artifact and therefore a Mac. scripts/verify-dmg.sh step 12 owns that
          # half, against the previously released dmg, before publishing.
          #
          # Compared against the previous TAG rather than the previous RELEASE:
          # a draft release is invisible to `contents: read`, and this job has no
          # reason to hold more than that.
          # The entry AFTER $TAG in a newest-first listing. Not "the newest tag
          # that is not $TAG", which returns a NEWER release when an older tag
          # is re-released. scripts/release/selftest.sh covers both.
          git tag --list 'v*' --sort=-creatordate > "$RUNNER_TEMP/tags"
          PREV="$(scripts/release/prev-tag.sh --tag "$TAG" --tags-file "$RUNNER_TEMP/tags")"
          if [ -z "$PREV" ]; then
            echo "::notice::${TAG} is the first tag; nothing is upgrading from anything yet."
            exit 0
          fi

          PREV_CFG="$(git show "${PREV}:.macos-builder/config" 2>/dev/null || true)"
          if [ -z "$PREV_CFG" ]; then
            echo "::notice::${PREV} predates .macos-builder/config; no identity to compare."
            exit 0
          fi
          PREV_ID="$(printf '%s\n' "$PREV_CFG" | sed -nE 's/^[[:space:]]*bundle_id[[:space:]]*=[[:space:]]*(.*[^[:space:]])[[:space:]]*$/\1/p' | head -1)"

          echo "${PREV}: ${PREV_ID:-<none>}"
          echo "${TAG}: ${BUNDLE_ID}"
          if [ "$PREV_ID" = "$BUNDLE_ID" ]; then
            echo "::notice::Bundle id unchanged since ${PREV}; installs will upgrade in place."
            exit 0
          fi

          if [ "$ALLOW" = "true" ]; then
            echo "::warning::Bundle id changed from '${PREV_ID}' to '${BUNDLE_ID}' since ${PREV}, allowed by allow_identity_change. Existing installs will NOT upgrade: they keep the old app, its permissions and its data."
            exit 0
          fi
          echo "::error::Bundle id changed from '${PREV_ID}' (${PREV}) to '${BUNDLE_ID}' (${TAG}). To macOS this is a different app: every existing install keeps its own copy, TCC grants reset and keychain items orphan. If that is intended, re-run this workflow with allow_identity_change=true."
          exit 1

  draft:
    name: draft release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create or reuse the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if STATE="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$STATE" != "true" ]; then
              echo "::error::${TAG} is already PUBLISHED. The builder's upload is asynchronous and cannot attach to a published release under immutable releases. Delete the release (keeping the tag) and re-run, or cut a new tag."
              exit 1
            fi
            echo "::notice::Reusing the existing draft for ${TAG}."
            exit 0
          fi

          ARGS=(--repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --generate-notes)
          # --verify-tag refuses to invent a tag that does not exist.
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$TAG" "${ARGS[@]}"
          echo "::notice::Created draft release ${TAG}."

  dispatch:
    name: dispatch macos-builder
    needs: [verify, draft]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This job needs NO access to this repository at all — only the PAT, whose
    # single power is starting a build on the builder.
    permissions: {}
    # Gates the trigger behind a required reviewer. It moves no credentials:
    # every Apple secret stays on the builder's Mac and never enters CI here.
    environment: release
    outputs:
      dispatched: ${{ steps.go.outputs.dispatched }}
    steps:
      - name: Ask the builder to build this tag
        id: go
        env:
          GH_TOKEN: ${{ secrets.MACOS_BUILDER_PAT }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::MACOS_BUILDER_PAT is not set — this repository is not onboarded to macos-builder. The draft for ${TAG} stays unfilled; see RELEASING.md."
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh workflow run build.yml \
            --repo stuffbucket/macos-builder \
            --ref main \
            -f "repo=${GITHUB_REPOSITORY}" \
            -f "ref=${TAG}"
          echo "dispatched=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Dispatched macos-builder for ${GITHUB_REPOSITORY}@${TAG}."

  collect:
    name: await + verify dmg
    needs: [verify, draft, dispatch]
    if: needs.dispatch.outputs.dispatched == 'true'
    runs-on: ubuntu-latest
    # Builder time is 20-40 min (install, Electron download, turbo build,
    # inside-out sign, hdiutil) plus Apple's unbounded notary queue.
    timeout-minutes: 75
    permissions:
      # write, not read: a DRAFT release is only visible to a token with push
      # access, so contents: read cannot see or download it.
      contents: write
    steps:
      - name: Wait for the signed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          DMG: ${{ needs.verify.outputs.dmg }}
          ZIP: ${{ needs.verify.outputs.zip }}
        run: |
          # Every asset the contract implies, not just the dmg. The builder
          # uploads them one at a time, so waiting on a subset can report success
          # while the rest are still in flight.
          REQUIRED=("$DMG" "${DMG}.sha256")
          if [ -n "$ZIP" ]; then
            REQUIRED+=("$ZIP" "${ZIP}.sha256")
          fi
          printf 'waiting for %d asset(s):\n' "${#REQUIRED[@]}"
          printf '  %s\n' "${REQUIRED[@]}"

          DEADLINE=$(( SECONDS + 3600 ))
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            MISSING=()
            for want in "${REQUIRED[@]}"; do
              # Herestring, never `printf "$ASSETS" | grep -q`. `grep -q`
              # exits at the first match and can SIGPIPE the writer, and here
              # that would not even fail the step: the non-zero pipeline takes
              # the `||` branch and reports an asset that IS attached as
              # missing, then waits the full hour for it. See
              # scripts/release/verify-assets.sh for the same hazard and how it
              # reached a real release.
              grep -qxF "$want" <<< "$ASSETS" || MISSING+=("$want")
            done
            if [ "${#MISSING[@]}" -eq 0 ]; then
              echo "::notice::All ${#REQUIRED[@]} assets are attached to ${TAG}."
              exit 0
            fi
            echo "still missing: ${MISSING[*]}  ($(( (DEADLINE - SECONDS) / 60 )) min left)"
            sleep 30
          done
          echo "::error::Timed out waiting on ${TAG}; still missing: ${MISSING[*]}. The draft is intact — check the macos-builder run, then re-run this workflow with workflow_dispatch to resume."
          exit 1

      - name: Check out the verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Cone mode (the default): a directory path, which is exactly what
          # this needs. Non-cone mode takes gitignore-style patterns, where a
          # bare `scripts/release` is not a reliable way to get the files.
          sparse-checkout: scripts/release

      - name: Verify what Ubuntu can prove
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          DMG: ${{ needs.verify.outputs.dmg }}
          ZIP: ${{ needs.verify.outputs.zip }}
          APP_NAME: ${{ needs.verify.outputs.app_name }}
        run: |
          # Presence, integrity and container shape. Gatekeeper, notarization
          # and the designated requirement cannot be checked off a Mac, and
          # AGENTS.md forbids GitHub-hosted macOS runners — scripts/verify-dmg.sh
          # owns that proof, run by a human before publishing.
          #
          # The assertions live in scripts/release/verify-assets.sh so
          # scripts/release/selftest.sh can drive every one of them, in both
          # directions, on every PR. They used to live inline here, where they
          # first executed during a real release: that is how v0.5.0-rc.4 failed
          # on four artifacts that were entirely correct.
          DL="$RUNNER_TEMP/assets"
          mkdir -p "$DL"

          PATTERNS=(--pattern "$DMG" --pattern "${DMG}.sha256")
          ARGS=(--dir "$DL" --dmg "$DMG" --app-name "$APP_NAME")
          if [ -n "$ZIP" ]; then
            PATTERNS+=(--pattern "$ZIP" --pattern "${ZIP}.sha256")
            ARGS+=(--zip "$ZIP")
          fi

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$DL" "${PATTERNS[@]}" --clobber

          scripts/release/verify-assets.sh "${ARGS[@]}"

      - name: Summary
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          DMG: ${{ needs.verify.outputs.dmg }}
        run: |
          {
            echo "### ${TAG} — draft release ready"
            echo
            echo "\`${DMG}\` is attached, signed, notarized and stapled by stuffbucket/macos-builder."
            echo
            echo "The release is a **draft** and this workflow will not publish it."
            echo "Before publishing, run the Gatekeeper acceptance test on a clean Mac:"
            echo
            echo "\`\`\`sh"
            echo "scripts/verify-dmg.sh ${TAG}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
