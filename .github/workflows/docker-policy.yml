name: Docker policy

on:
  pull_request:
    branches: [main]
    paths:
      - .bun-version
      - .dockerignore
      - .npmrc
      - .pnpmfile.cjs
      - .nvmrc
      - Dockerfile
      - mise.lock
      - package.json
      - packages/**/package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/**
      - tests/docker-test-policy.test.mjs
  push:
    branches: [main]
    paths:
      - .bun-version
      - .dockerignore
      - .npmrc
      - .pnpmfile.cjs
      - .nvmrc
      - Dockerfile
      - mise.lock
      - package.json
      - packages/**/package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/**
      - tests/docker-test-policy.test.mjs
  schedule:
    - cron: "31 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  policy:
    name: pinned dependency image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # The host wrapper needs only Node. The image installs its own locked
      # pnpm, Bun, dependencies and support tools before the offline test run.
      - name: Build pinned image and run policy suite
        run: node scripts/docker-test.mjs --suite=policy
